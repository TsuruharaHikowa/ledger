<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>记账本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>

<button id="fab" data-action="add" aria-label="记一笔"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav id="nav">
  <button data-action="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M8 7h11M8 12h11M8 17h11"/><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg><span>明细</span></button>
  <button data-action="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M6 19v-6M12 19V5M18 19v-9"/></svg><span>统计</span></button>
  <button data-action="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg><span>设置</span></button>
</nav>

<div id="sheet-root" hidden>
  <div class="backdrop" data-action="close-sheet"></div>
  <div class="sheet" id="sheet"></div>
</div>

<div id="toast" hidden></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
